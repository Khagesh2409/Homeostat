global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Scrape Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the Homeostat agent's own metrics
  - job_name: homeostat-agent
    static_configs:
      - targets: ['agent:8080']
    metrics_path: /metrics

  # Scrape Alertmanager
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
