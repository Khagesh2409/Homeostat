---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeostat-operator
  namespace: homeostat
spec:
  template:
    spec:
      containers:
        - name: agent
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          env:
            - name: HOMEOSTAT_ENVIRONMENT
              value: "production"
            - name: HOMEOSTAT_LOG_LEVEL
              value: "INFO"
