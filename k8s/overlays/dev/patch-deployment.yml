---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeostat-operator
  namespace: homeostat
spec:
  template:
    spec:
      containers:
        - name: agent
          imagePullPolicy: Never
          env:
            - name: HOMEOSTAT_ENVIRONMENT
              value: "development"
            - name: HOMEOSTAT_LOG_LEVEL
              value: "DEBUG"
            - name: HOMEOSTAT_LOCAL_MODE
              value: "true"
            - name: HOMEOSTAT_WATCHDOG_URL
              value: "http://host.k3d.internal:8000"
            - name: AWS_ENDPOINT_URL
              value: "http://localstack.default.svc:4566"
