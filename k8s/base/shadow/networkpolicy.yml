---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shadow-isolation
  namespace: homeostat-shadow
  labels:
    app.kubernetes.io/managed-by: homeostat
    app.kubernetes.io/part-of: homeostat
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow probes and health checks from the agent operator
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homeostat
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow intra-shadow communication
    - to:
        - podSelector: {}
