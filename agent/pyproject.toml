[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homeostat"
version = "0.1.0"
description = "Autonomous AI infrastructure operator"
requires-python = ">=3.12"
dependencies = [
    # LangGraph — the agent orchestration framework
    "langgraph>=0.2.0",
    "langchain-aws>=0.2.0",
    "langchain-core>=0.3.0",

    # AWS SDK
    "boto3>=1.35.0",
    "botocore>=1.35.0",

    # HTTP server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Prometheus metrics
    "prometheus-client>=0.21.0",

    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Async utilities
    "anyio>=4.6.0",
    "httpx>=0.27.0",

    # Utilities
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "moto[s3,dynamodb]>=5.0.0",     # Mock AWS services for tests
    "respx>=0.21.0",                  # Mock HTTP calls
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-boto3>=1.0.0",
    "boto3-stubs[bedrock-runtime,s3,dynamodb,iam,budgets]>=1.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/homeostat"]

# ── Ruff (linter + formatter) ──────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hints)
    "S",   # bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "ANN101",  # self type annotation not required
    "ANN102",  # cls type annotation not required
    "S101",    # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]   # relax type + security rules in tests

# ── Mypy (type checker) ────────────────────────
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

# ── Pytest ─────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=homeostat",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    # --cov-fail-under is intentionally omitted here.
    # Coverage gate is enforced in CI via: make test-cov
    # Running a subset of tests locally shouldn't fail on package-wide coverage.
    "-v",
]
