name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install agent dev deps
        run: cd agent && uv pip install -e ".[dev]" --system

      - name: Install watchdog dev deps
        run: cd watchdog && uv pip install -e ".[dev]" --system

      - name: Ruff (agent)
        run: cd agent && ruff check src/ tests/

      - name: Ruff (watchdog)
        run: cd watchdog && ruff check src/ tests/

      - name: Mypy (agent)
        run: cd agent && mypy src/homeostat/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install agent dev deps
        run: cd agent && uv pip install -e ".[dev]" --system

      - name: Run unit tests
        run: cd agent && pytest tests/unit/ -v --cov=src/homeostat --cov-report=xml
        env:
          # Use moto for mock AWS — no real AWS needed
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: agent/coverage.xml
          flags: unit

  test-watchdog:
    name: Watchdog Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install watchdog dev deps
        run: cd watchdog && uv pip install -e ".[dev]" --system

      - name: Run watchdog tests
        run: cd watchdog && pytest tests/ -v
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: false
          tags: homeostat-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build watchdog image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./watchdog
          push: false
          tags: homeostat-watchdog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Validate 00-bootstrap
        run: |
          cd terraform/00-bootstrap
          terraform init -backend=false
          terraform validate

      - name: Validate 03-storage
        run: |
          cd terraform/03-storage
          terraform init -backend=false
          terraform validate
