name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install agent dev deps
        run: cd agent && uv pip install -e ".[dev]" --system

      - name: Install watchdog dev deps
        run: cd watchdog && uv pip install -e ".[dev]" --system

      - name: Ruff (agent)
        run: cd agent && ruff check src/ tests/

      - name: Ruff (watchdog)
        run: cd watchdog && ruff check src/ tests/

      - name: Mypy (agent)
        run: cd agent && mypy src/homeostat/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install agent dev deps
        run: cd agent && uv pip install -e ".[dev]" --system

      - name: Run unit tests
        run: cd agent && pytest tests/unit/ -v --cov=src/homeostat --cov-report=xml
        env:
          # Use moto for mock AWS — no real AWS needed
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: agent/coverage.xml
          flags: unit

  test-watchdog:
    name: Watchdog Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install watchdog dev deps
        run: cd watchdog && uv pip install -e ".[dev]" --system

      - name: Run watchdog tests
        run: cd watchdog && pytest tests/ -v
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-watchdog]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
        continue-on-error: true

      - name: Log in to Amazon ECR
        id: login-ecr
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.login-ecr.outcome == 'success' }}
          tags: |
            homeostat-agent:ci
            ${{ steps.login-ecr.outputs.registry }}/homeostat-agent:latest
            ${{ steps.login-ecr.outputs.registry }}/homeostat-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push watchdog image
        uses: docker/build-push-action@v6
        with:
          context: ./watchdog
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.login-ecr.outcome == 'success' }}
          tags: |
            homeostat-watchdog:ci
            ${{ steps.login-ecr.outputs.registry }}/homeostat-watchdog:latest
            ${{ steps.login-ecr.outputs.registry }}/homeostat-watchdog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Validate 00-bootstrap
        run: |
          cd terraform/00-bootstrap
          terraform init -backend=false
          terraform validate

      - name: Validate 03-storage
        run: |
          cd terraform/03-storage
          terraform init -backend=false
          terraform validate

      - name: Validate 05-watchdog
        run: |
          cd terraform/05-watchdog
          terraform init -backend=false
          terraform validate

      - name: Validate 06-ecr
        run: |
          cd terraform/06-ecr
          terraform init -backend=false
          terraform validate
